<div class="vacancie-page-wrap">
  <div class="vacancie-filter">
    <app-ecofarm-vacancy-filter
      (filterCityChange)="onCityFilterChange($event)"
      (filterRoleChange)="onRoleFilterChange($event)"
    ></app-ecofarm-vacancy-filter>
  </div>

  <div class="vacancies-list">
    <app-vacancies-card *ngFor="let vacancy of vacancies" [vacancy]="vacancy"></app-vacancies-card>
  </div>
</div>
